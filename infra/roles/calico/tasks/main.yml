---
- name: Create Calico manifest directory
  ansible.builtin.file:
    path: /etc/kubernetes/calico
    state: directory
    owner: root
    group: root
    mode: 0755

- name: Render Calico Installation manifest
  ansible.builtin.template:
    src: installation.yaml.j2
    dest: /etc/kubernetes/calico/installation.yaml
    owner: root
    group: root
    mode: 0644

- name: Apply Calico CRDs
  ansible.builtin.command:
    cmd: >
      kubectl apply
      --server-side
      --force-conflicts
      -f https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/v1_crd_projectcalico_org.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: calico_crd_apply
  changed_when: >
    'created' in calico_crd_apply.stdout or
    'configured' in calico_crd_apply.stdout or
    'serverside-applied' in calico_crd_apply.stdout

- name: Wait for Installation CRD to be established
  ansible.builtin.command:
    cmd: >
      kubectl wait
      --for=condition=Established
      crd/installations.operator.tigera.io
      --timeout=120s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false

- name: Apply Tigera Operator
  ansible.builtin.command:
    cmd: >
      kubectl apply
      -f https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/tigera-operator.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: tigera_operator_apply
  changed_when: >
    'created' in tigera_operator_apply.stdout or
    'configured' in tigera_operator_apply.stdout

- name: Wait for Tigera Operator
  ansible.builtin.command:
    cmd: >
      kubectl rollout status
      deployment/tigera-operator
      -n tigera-operator
      --timeout=180s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false

- name: Apply Calico Installation
  ansible.builtin.command:
    cmd: >
      kubectl apply
      -f /etc/kubernetes/calico/installation.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: calico_installation_apply
  changed_when: >
    'created' in calico_installation_apply.stdout or
    'configured' in calico_installation_apply.stdout

- name: Wait for calico-node DaemonSet to exist
  ansible.builtin.command:
    cmd: >
      kubectl get daemonset/calico-node
      -n calico-system
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: calico_node_daemonset
  retries: 60
  delay: 5
  until: calico_node_daemonset.rc == 0
  changed_when: false


- name: Wait for calico-node rollout
  ansible.builtin.command:
    cmd: >
      kubectl rollout status
      daemonset/calico-node
      -n calico-system
      --timeout=300s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false

- name: Wait for all Kubernetes nodes to become Ready
  ansible.builtin.command:
    cmd: >
      kubectl wait
      --for=condition=Ready
      nodes
      --all
      --timeout=300s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false
