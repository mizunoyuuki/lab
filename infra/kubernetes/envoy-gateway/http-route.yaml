apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ruby-app-route
  namespace: default
spec:
  parentRefs:
    - name: ruby-gateway

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ruby-app
          port: 80
